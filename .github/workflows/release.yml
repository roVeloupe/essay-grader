name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version to build (used only to name the artifacts)
        required: true
        default: '2.0.0'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build the Windows installer
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Engine binary: the opencode-ai package ships opencode.exe (180 MB), so it is not committed
      - name: Prepare the opencode engine
        shell: pwsh
        run: |
          npm install -g opencode-ai@1.19.0 --foreground-scripts
          $src = Join-Path (npm root -g) 'opencode-ai\bin\opencode.exe'
          if (-not (Test-Path $src)) { throw "opencode.exe not found: $src" }
          New-Item -ItemType Directory -Force -Path bin | Out-Null
          Copy-Item $src bin\opencode.exe
          (Get-Item bin\opencode.exe).Length

      # Proxy: third-party component, pulled at the pinned commit
      - name: Prepare the opencode2api proxy
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/TiaraBasori/opencode2api.git opencode2api
          Push-Location opencode2api
          npm install --omit=dev
          Pop-Location
          Get-ChildItem opencode2api/src | Select-Object Name

      - name: Install app dependencies
        shell: pwsh
        working-directory: desktop
        run: |
          npm install
          if (-not (Test-Path node_modules\electron\dist\electron.exe)) {
            node node_modules\electron\install.js
          }

      - name: Package with NSIS
        shell: pwsh
        working-directory: desktop
        run: npm run dist

      - name: Record SHA256
        shell: pwsh
        run: |
          $f = Get-ChildItem desktop/dist/*.exe | Select-Object -First 1
          $h = (Get-FileHash $f.FullName -Algorithm SHA256).Hash
          "$($f.Name)  $([math]::Round($f.Length/1MB,1)) MB" | Tee-Object -FilePath sha.txt -Append
          "SHA256: $h" | Tee-Object -FilePath sha.txt -Append

      - uses: actions/upload-artifact@v4
        with:
          name: installer
          path: |
            desktop/dist/*.exe
            sha.txt
          retention-days: 7

      - name: Upload to the release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $exe = (Get-ChildItem desktop/dist/*.exe | Select-Object -First 1).FullName
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "Essay Grader $tag" --notes-file CHANGELOG.md
          }
          gh release upload $tag $exe --clobber
          Get-Content sha.txt
