name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 要构建的版本号（仅用于命名产物）
        required: true
        default: '2.0.0'

permissions:
  contents: write

jobs:
  build-windows:
    name: 构建 Windows 安装包
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # 引擎二进制：opencode-ai 包内自带 opencode.exe（180 MB），不入库
      - name: 准备 opencode 引擎
        shell: pwsh
        run: |
          npm install -g opencode-ai@1.19.0 --foreground-scripts
          $src = Join-Path (npm root -g) 'opencode-ai\bin\opencode.exe'
          if (-not (Test-Path $src)) { throw "opencode.exe 未找到：$src" }
          New-Item -ItemType Directory -Force -Path bin | Out-Null
          Copy-Item $src bin\opencode.exe
          (Get-Item bin\opencode.exe).Length

      # 代理：第三方组件，按 pin 的 commit 拉取
      - name: 准备 opencode2api 代理
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/TiaraBasori/opencode2api.git opencode2api
          Push-Location opencode2api
          npm install --omit=dev
          Pop-Location
          Get-ChildItem opencode2api/src | Select-Object Name

      - name: 安装应用依赖
        shell: pwsh
        working-directory: desktop
        run: |
          npm install
          if (-not (Test-Path node_modules\electron\dist\electron.exe)) {
            node node_modules\electron\install.js
          }

      - name: 打包 NSIS
        shell: pwsh
        working-directory: desktop
        run: npm run dist

      - name: 记录 SHA256
        shell: pwsh
        run: |
          $f = Get-ChildItem desktop/dist/*.exe | Select-Object -First 1
          $h = (Get-FileHash $f.FullName -Algorithm SHA256).Hash
          "$($f.Name)  $([math]::Round($f.Length/1MB,1)) MB" | Tee-Object -FilePath sha.txt -Append
          "SHA256: $h" | Tee-Object -FilePath sha.txt -Append

      - uses: actions/upload-artifact@v4
        with:
          name: installer
          path: |
            desktop/dist/*.exe
            sha.txt
          retention-days: 7

      - name: 上传到 Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $exe = (Get-ChildItem desktop/dist/*.exe | Select-Object -First 1).FullName
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "语文作文批改助手 $tag" --notes-file CHANGELOG.md
          }
          gh release upload $tag $exe --clobber
          Get-Content sha.txt
