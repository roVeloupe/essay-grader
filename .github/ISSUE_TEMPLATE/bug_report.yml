name: Bug report
description: Broken behaviour, errors, or UI problems
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Before filing, skim [docs/TROUBLESHOOTING.md](../blob/main/docs/TROUBLESHOOTING.md) —
        most common problems already have a ready answer there.
  - type: input
    id: version
    attributes:
      label: Version
      description: Installer version, or `git rev-parse --short HEAD`
      placeholder: 2.0.0
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Where it broke
      options:
        - Install / startup
        - Engine (stuck on "starting")
        - Importing images
        - Recognition (OCR)
        - Review / typo classification
        - Grading scores or feedback
        - Export (Word / PDF / Markdown)
        - UI and interaction
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you saw, and what you expected
      placeholder: After importing a 3-page essay I clicked Start grading and the status stayed on "recognising"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        The tail of `%APPDATA%\essay-grader\engine.log` or `backend.log`.
        **Please strip any paths that identify you**.
      render: text
    validations:
      required: false
  - type: textarea
    id: env
    attributes:
      label: Environment
      placeholder: |
        Windows 11 23H2 / 8 GB RAM / 10th-gen i5
        Installer 2.0.0, model DeepSeek V4.1 Flash (default)
    validations:
      required: false
