name: 功能建议
description: 新功能、体验改进、评分标准相关
title: "[feat] "
labels: ["enhancement"]
body:
  - type: textarea
    id: scene
    attributes:
      label: 使用场景
      description: 你在什么情况下觉得缺了点什么？
      placeholder: 一个班 50 本，想按学号顺序批量导出，现在只能一篇篇点
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 你希望它怎么工作
      placeholder: 导入时能按文件名排序并显示序号，导出全部时按序号命名
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: 影响面
      options:
        - 只影响我自己
        - 大部分老师都会用到
        - 属于锦上添花
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: 你现在的替代做法
      description: 有的话写一下，方便判断优先级
    validations:
      required: false
