name: Feature request
description: New features, usability improvements, or rubric changes
title: "[feat] "
labels: ["enhancement"]
body:
  - type: textarea
    id: scene
    attributes:
      label: Use case
      description: When did you feel something was missing?
      placeholder: I have 50 essays per class and want to export them in student-number order, but today I have to click through them one by one
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: How you would like it to work
      placeholder: Sort by filename on import and show the index, then name each export after that index when exporting everything
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: Who it affects
      options:
        - Only me
        - Most teachers would use it
        - Nice to have
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: What you do instead today
      description: If you have a workaround, describe it — it helps with prioritisation
    validations:
      required: false
